<!doctype html>

  <meta charset="utf-8">
  <script>
    // アドレスバーのURLを正規化する（openExternalBrowser=1を必ず含む形に）。
    // ページ遷移・再読み込みはしない（history.replaceStateのみ）。既存のquery/hashは壊さない。
    // LINE等のUser-Agent判定は行わない・強制的な外部ブラウザ遷移も行わない。
    (function () {
      try {
        var u = new URL(location.href);
        if (u.searchParams.get("openExternalBrowser") === "1") return; // 既に正規化済み
        u.searchParams.set("openExternalBrowser", "1");
        if (!u.hash) u.hash = "#/"; // 素のトップURLだけ、hashを補う
        history.replaceState(null, "", u.href);
      } catch (e) {}
    })();
  </script>
