<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>世界の偉人性格診断</title>
  <meta name="description" content="12問で100人の偉人のうち誰に近いかを楽しむ、登録不要の無料診断。">
  <meta property="og:title" content="世界の偉人性格診断">
  <meta property="og:description" content="100人の偉人のうち、あなたは誰？ 12問・登録なし">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://ijin-shindan.github.io/app/og/top.png">
  <meta property="og:url" content="https://ijin-shindan.github.io/app/">
  <link rel="canonical" href="https://ijin-shindan.github.io/app/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=cd4b73c-202610292235">
  <link rel="stylesheet" href="motion.css?v=5">
  <link rel="stylesheet" href="guide.css?v=6">
</head>
<body>
  <main id="app">
    <section class="hero">
      <div class="seal">偉</div>
      <div id="guide"></div>
      <h1>100人の偉人のうち、<br>あなたは誰？</h1>
      <p class="sub">12問・約1分半・登録なし</p>
    </section>
    <div class="cta">
      <a class="btn start" href="#/q/normal">診断スタート</a>
      <a class="btn love-sub" href="#/q/love">💘 恋愛バージョンもある</a>
    </div>
    <noscript>
      <style>.cta,.teaser{display:none!important}</style>
      <section class="card" role="alert">
        <h2>JavaScriptがオフのため、診断を始められません</h2>
        <p>JavaScriptを有効にして、ページをもう一度読み込んでください。この操作では答えや端末の記録を消しません。</p>
      </section>
    </noscript>
    <div class="teaser"></div>
  </main>
  <div id="overlay" hidden></div>
  <div id="sheet" hidden></div>
  <script type="module" src="main.js?v=cd4b73c-202610292235"></script>
  <script>
    let bootFailed = false;
    function showBootFailure() {
      if (bootFailed || window.__ijinReady || window.__ijinBootErrorHandled) return;
      bootFailed = true;
      const app = document.getElementById('app');
      const alert = document.createElement('section');
      alert.className = 'card';
      alert.setAttribute('role', 'alert');
      const heading = document.createElement('h1');
      heading.textContent = 'ページを読み込めませんでした';
      const message = document.createElement('p');
      message.textContent = '通信状況を確かめて、もう一度読み込んでください。この操作では答えや端末の記録を消しません。';
      const retry = document.createElement('button');
      retry.className = 'btn start';
      retry.type = 'button';
      retry.textContent = 'もう一度読み込む';
      retry.addEventListener('click', () => location.reload());
      alert.append(heading, message, retry);
      app.replaceChildren(alert);
    }
    document.querySelector('script[type="module"]').addEventListener('error', showBootFailure);
    window.addEventListener('error', (event) => {
      if (!event.filename || window.__ijinReady || window.__ijinBootErrorHandled) return;
      const script = new URL(event.filename, location.href);
      const appPath = new URL('.', location.href).pathname;
      if (script.origin === location.origin && script.pathname.startsWith(appPath) && script.pathname.endsWith('.js')) {
        showBootFailure();
      }
    });
  </script>
</body>
</html>
